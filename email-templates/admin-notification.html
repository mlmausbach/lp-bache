<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Novo lead — Bäche</title>
</head>
<body style="margin:0;padding:0;background-color:#0D0C14;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#0D0C14;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <!-- Card -->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#9730EF 0%,#9500E0 33%,#42006C 67%,#3F0967 100%);border-radius:16px 16px 0 0;padding:32px 40px;text-align:center;">
              <img src="https://mlmausbach.github.io/lp-bache/assets/logo-horizontal-white.svg"
                   alt="Bäche" width="100" height="auto"
                   style="display:block;margin:0 auto 20px;height:28px;width:auto;" />
              <!-- Pulse dot -->
              <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(0,224,184,0.15);border:1px solid rgba(0,224,184,0.3);border-radius:100px;padding:6px 16px;">
                <div style="width:8px;height:8px;background:#00E0B8;border-radius:50%;"></div>
                <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#00E0B8;">Novo Lead</span>
              </div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background:#15131E;padding:36px 40px;">

              <p style="margin:0 0 28px;font-size:15px;line-height:1.7;color:rgba(232,230,245,0.75);">
                Um novo lead preencheu o formulário de <strong style="color:#E8E6F5;">Diagnóstico Gratuito</strong> na landing page.
              </p>

              <!-- Lead data -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                     style="background:#0D0C14;border:1px solid rgba(151,48,239,0.25);border-radius:12px;margin-bottom:28px;overflow:hidden;">
                <!-- Nome -->
                <tr>
                  <td style="padding:16px 24px;border-bottom:1px solid rgba(232,230,245,0.06);">
                    <p style="margin:0 0 3px;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(232,230,245,0.35);">Nome</p>
                    <p style="margin:0;font-size:16px;font-weight:700;color:#E8E6F5;letter-spacing:-0.01em;">{{lead_name}}</p>
                  </td>
                </tr>
                <!-- WhatsApp -->
                <tr>
                  <td style="padding:16px 24px;border-bottom:1px solid rgba(232,230,245,0.06);">
                    <p style="margin:0 0 3px;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(232,230,245,0.35);">WhatsApp</p>
                    <p style="margin:0;font-size:16px;font-weight:700;color:#00E0B8;letter-spacing:-0.01em;">
                      <a href="https://wa.me/55{{lead_whatsapp_digits}}" style="color:#00E0B8;text-decoration:none;">{{lead_whatsapp}}</a>
                    </p>
                  </td>
                </tr>
                <!-- E-mail -->
                <tr>
                  <td style="padding:16px 24px;">
                    <p style="margin:0 0 3px;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(232,230,245,0.35);">E-mail</p>
                    <p style="margin:0;font-size:15px;font-weight:600;color:#E8E6F5;">
                      <a href="mailto:{{lead_email}}" style="color:#E8E6F5;text-decoration:none;">{{lead_email}}</a>
                    </p>
                  </td>
                </tr>
              </table>

              <!-- CTAs -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="padding-right:8px;width:50%;">
                    <a href="https://wa.me/55{{lead_whatsapp_digits}}?text=Olá%20{{lead_name}}%2C%20aqui%20é%20o%20Murillo%20da%20Bäche.%20Vi%20seu%20interesse%20no%20Diagnóstico%20Gratuito%20—%20podemos%20conversar%3F"
                       style="display:block;padding:14px 20px;background:linear-gradient(135deg,#9730EF,#3F0967);border-radius:100px;font-size:13px;font-weight:700;color:#ffffff;text-decoration:none;text-align:center;">
                      Responder no WhatsApp
                    </a>
                  </td>
                  <td style="padding-left:8px;width:50%;">
                    <a href="https://app.clickup.com/9011481680/v/l/901111231101"
                       style="display:block;padding:14px 20px;background:transparent;border:1px solid rgba(232,230,245,0.15);border-radius:100px;font-size:13px;font-weight:600;color:rgba(232,230,245,0.75);text-decoration:none;text-align:center;">
                      Ver no ClickUp
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="height:3px;background:linear-gradient(90deg,#9730EF,#00E0B8,#9730EF);"></td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#0D0C14;border-radius:0 0 16px 16px;padding:20px 40px;text-align:center;">
              <p style="margin:0;font-size:11px;color:rgba(232,230,245,0.25);">
                Bäche — Performance Branding para Saúde · Notificação interna
              </p>
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>

</body>
</html>
